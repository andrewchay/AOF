apiVersion: v1
kind: Secret
metadata:
  name: aof-secrets
  namespace: aof
type: Opaque
stringData:
  # NebulaGraph 认证
  NEBULA_USER: "root"
  NEBULA_PASSWORD: "nebula"
  
  # Redis 认证（如果有）
  REDIS_PASSWORD: ""
  
  # LLM API Key
  LLM_API_KEY: ""
  
  # JWT 密钥
  JWT_SECRET_KEY: "change-this-secret-in-production"
  
  # 数据库密码（如果使用外部数据库）
  DATABASE_URL: ""
