apiVersion: apps/v1
kind: Deployment
metadata:
  name: aof-api
  namespace: aof
  labels:
    app: aof-api
spec:
  replicas: 1  # D04 fix: single instance until shared state is proven
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aof-api
  template:
    metadata:
      labels:
        app: aof-api
    spec:
      containers:
      - name: api
        image: aof:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8787
          protocol: TCP
        env:
        - name: AOF_ROOT
          value: "/app"
        envFrom:
        - configMapRef:
            name: aof-config
        - secretRef:
            name: aof-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: aof-data
          mountPath: /app/data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: aof-data
        persistentVolumeClaim:
          claimName: aof-data-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - aof-api
              topologyKey: kubernetes.io/hostname
