apiVersion: apps/v1
kind: Deployment
metadata:
  name: aof-api
  namespace: aof
  labels:
    app: aof-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aof-api
  template:
    metadata:
      labels:
        app: aof-api
    spec:
      containers:
      - name: api
        image: aof:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8787
          protocol: TCP
        env:
        - name: AOF_ROOT
          value: "/app"
        envFrom:
        - configMapRef:
            name: aof-config
        - secretRef:
            name: aof-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - aof-api
              topologyKey: kubernetes.io/hostname
