apiVersion: v1
kind: Service
metadata:
  name: aof-api
  namespace: aof
  labels:
    app: aof-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: aof-api
---
apiVersion: v1
kind: Service
metadata:
  name: aof-api-headless
  namespace: aof
  labels:
    app: aof-api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8787
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: aof-api
