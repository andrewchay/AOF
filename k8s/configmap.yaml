apiVersion: v1
kind: ConfigMap
metadata:
  name: aof-config
  namespace: aof
data:
  # API 配置
  API_PORT: "8787"
  API_WORKERS: "4"
  
  # NebulaGraph 配置
  NEBULA_HOST: "nebula-graphd"
  NEBULA_PORT: "9669"
  NEBULA_SPACE: "aof_default"
  
  # Redis 配置
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # 缓存配置
  CACHE_L1_SIZE: "10000"
  CACHE_L2_ENABLED: "true"
  
  # 任务队列配置
  TASK_QUEUE_MAX_CONCURRENT: "5"
  TASK_RESULT_TTL: "86400"
  
  # 物化视图配置
  MV_REFRESH_INTERVAL: "3600"
  
  # 日志配置
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
