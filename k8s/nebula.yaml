---
apiVersion: v1
kind: Service
metadata:
  name: nebula-storaged
  namespace: aof
  labels:
    app: nebula-storaged
spec:
  clusterIP: None
  selector:
    app: nebula-storaged
  ports:
  - port: 9779
    name: thrift
  - port: 19779
    name: http
  - port: 19780
    name: http2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-graphd
  namespace: aof
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nebula-graphd
  template:
    metadata:
      labels:
        app: nebula-graphd
    spec:
      containers:
      - name: graphd
        image: vesoft/nebula-graphd:v3.8.0
        ports:
        - containerPort: 9669
          name: thrift
        - containerPort: 19669
          name: http
        - containerPort: 19670
          name: http2
        command:
        - /bin/sh
        - -c
        - |
          /usr/local/nebula/bin/nebula-graphd \
            --meta_server_addrs=nebula-metad-0.nebula-metad:9559,nebula-metad-1.nebula-metad:9559,nebula-metad-2.nebula-metad:9559 \
            --ws_ip=0.0.0.0 \
            --port=9669 \
            --ws_http_port=19669 \
            --enable_authorize=false
---
apiVersion: v1
kind: Service
metadata:
  name: nebula-graphd
  namespace: aof
  labels:
    app: nebula-graphd
spec:
  selector:
    app: nebula-graphd
  ports:
  - port: 9669
    targetPort: 9669
    name: thrift
  - port: 19669
    targetPort: 19669
    name: http
