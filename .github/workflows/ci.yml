name: AOF CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Governance Gate
        run: python tools/governance/validate_release_gate.py --root data/governance --strict

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy aof_add.py aof_run.py aof_doctor.py bridge services tools || true

      - name: Run tests
        run: pytest -v

      - name: API documentation drift
        run: python tools/export_openapi.py --check
