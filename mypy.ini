[mypy]
explicit_package_bases = True
mypy_path = .
namespace_packages = True

# W11.01: optional third-party integrations ship no type stubs; the
# import boundary is validated at runtime (fail-closed readiness), so
# their absence must not blind the whole-repository type check.
[mypy-cognee.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-nebula3.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-docling.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-yaml]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-opentelemetry.*]
ignore_missing_imports = True

# ---- W11.01 baseline exemptions (do not append below this line) ----

[mypy-aof_doctor]
ignore_errors = True
