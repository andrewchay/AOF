# AOF Semantic Middle Layer API - Docker Compose
# Usage: docker-compose up -d

version: '3.8'

services:
  aof-semantic-api:
    build:
      context: ../..
      dockerfile: services/semantic_middle_layer_api/Dockerfile
      args:
        INSTALL_COGNEE: "1"
        COGNEE_PIP_SPEC: "cognee"
    image: aof-semantic-api:latest
    container_name: aof-semantic-api
    restart: unless-stopped
    
    ports:
      - "8787:8787"
    
    environment:
      - AOF_ROOT=/app/AOF
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-custom}
      - LLM_MODEL=${LLM_MODEL:-deepseek/deepseek-chat}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-https://api.deepseek.com/v1}
      - COGNEE_ROOT=${COGNEE_ROOT:-}
      - PYTHONUNBUFFERED=1
    
    volumes:
      # Persistent data directories
      - ../../data:/app/AOF/data
      - ../../logs:/app/AOF/logs
      - ../../ontologies:/app/AOF/ontologies
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

