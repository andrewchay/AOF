# Nginx configuration for AOF Semantic Middle Layer API
# Place this file in the same directory as docker-compose.prod.yml

events {
    worker_connections 1024;
}

http {
    upstream aof_api {
        server aof-semantic-api:8787;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=build_limit:10m rate=1r/m;

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint (no rate limit)
        location /healthz {
            proxy_pass http://aof_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API documentation (no rate limit)
        location /docs {
            proxy_pass http://aof_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # OpenAPI schema
        location /openapi.json {
            proxy_pass http://aof_api;
            proxy_set_header Host $host;
        }

        # Build endpoint (strict rate limit)
        location /v1/build {
            limit_req zone=build_limit burst=2 nodelay;
            proxy_pass http://aof_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # All other API endpoints
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://aof_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for long-running requests
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 300s;
        }
    }

    # HTTPS configuration (uncomment and configure SSL certificates)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     location / {
    #         proxy_pass http://aof_api;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #     }
    # }
}
