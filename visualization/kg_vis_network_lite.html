<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识图谱可视化 (轻量版) - AOF</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg-start: #f9fbff;
            --bg-end: #eef3fb;
            --surface: rgba(255, 255, 255, 0.96);
            --surface-soft: #f5f8ff;
            --border: rgba(15, 23, 42, 0.12);
            --border-soft: rgba(15, 23, 42, 0.08);
            --text: #0f172a;
            --text-muted: #5b677d;
            --text-soft: #8a94a8;
            --accent: #0ea5e9;
            --accent-strong: #0284c7;
            --success: #16a34a;
            --warn: #b45309;
            --shadow-lg: 0 24px 54px rgba(15, 23, 42, 0.12);
            --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.08);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: "Space Grotesk", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 5%, rgba(56, 189, 248, 0.15), transparent 28%),
                radial-gradient(circle at 86% 12%, rgba(59, 130, 246, 0.16), transparent 30%),
                linear-gradient(165deg, var(--bg-start) 0%, var(--bg-end) 100%);
            overflow: hidden;
        }

        #container {
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            gap: 18px;
            height: 100vh;
            padding: 18px;
        }

        #sidebar {
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            backdrop-filter: blur(8px);
        }

        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.15);
            border-radius: 999px;
        }

        .header-card {
            border-radius: var(--radius-lg);
            border: 1px solid rgba(14, 165, 233, 0.2);
            background:
                linear-gradient(120deg, rgba(14, 165, 233, 0.08), rgba(99, 102, 241, 0.12));
            padding: 14px;
        }

        h1 {
            font-size: 20px;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.55;
        }

        .section {
            background: var(--surface-soft);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 12px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #book-search {
            width: 100%;
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            padding: 9px 12px;
            font-size: 12px;
            color: var(--text);
            background: #fff;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        #book-search:focus {
            border-color: rgba(14, 165, 233, 0.45);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
        }

        #book-search::placeholder { color: var(--text-soft); }

        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #fff;
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            padding: 4px;
        }

        .mode-tab {
            border: none;
            border-radius: 999px;
            padding: 8px 10px;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all .18s ease;
        }

        .mode-tab.active {
            background: linear-gradient(120deg, #0ea5e9, #2563eb);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 3px;
        }

        .book-grid::-webkit-scrollbar { width: 5px; }
        .book-grid::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.16);
            border-radius: 999px;
        }

        .book-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 10px;
            border-radius: 11px;
            border: 1px solid var(--border-soft);
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: all .2s ease;
        }

        .book-item:hover {
            transform: translateY(-1px);
            border-color: rgba(14, 165, 233, 0.45);
            box-shadow: 0 8px 18px rgba(14, 165, 233, 0.12);
        }

        .book-item.selected {
            border-color: transparent;
            background: linear-gradient(130deg, #0ea5e9, #2563eb);
            color: #fff;
            box-shadow: 0 10px 18px rgba(37, 99, 235, 0.28);
        }

        .book-item.selected .book-count { color: rgba(255, 255, 255, 0.8); }

        .book-icon { font-size: 14px; }
        .book-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-count { font-size: 10px; color: var(--text-soft); }

        .btn-group { display: flex; gap: 8px; }
        .btn-group .btn { flex: 1; }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 9px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s ease;
        }

        .btn-primary {
            background: linear-gradient(120deg, #0ea5e9, #2563eb);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.28);
        }

        .btn-primary:hover { transform: translateY(-1px); }

        .btn-secondary {
            background: #fff;
            border: 1px solid var(--border-soft);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--border);
            color: var(--text);
            background: #f8fbff;
        }

        .sample-size { margin-top: 10px; }
        .sample-size label { font-size: 11px; color: var(--text-muted); }
        .sample-size input { width: 100%; margin-top: 6px; }

        #main {
            position: relative;
            border-radius: 28px;
            border: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.82);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        #network { width: 100%; height: 100%; }

        #stats {
            position: absolute;
            top: 14px;
            right: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            box-shadow: var(--shadow-md);
            padding: 10px 12px;
            min-width: 200px;
            z-index: 6;
            font-size: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            color: var(--text-muted);
        }

        .stat-value {
            font-weight: 700;
            color: var(--accent-strong);
            font-variant-numeric: tabular-nums;
        }

        #loading {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 20;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid rgba(148, 163, 184, 0.24);
            border-top-color: #0ea5e9;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { font-size: 13px; color: var(--text-muted); }
        .loading-progress { font-size: 11px; color: var(--text-soft); }

        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 44px; }
        .hidden { display: none !important; }

        @media (max-width: 1080px) {
            #container {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
                gap: 12px;
                padding: 12px;
            }
            #sidebar {
                max-height: 42vh;
                border-radius: 18px;
            }
            #main { border-radius: 18px; }
            #stats { min-width: 170px; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <div class="header-card">
                <h1>知识图谱总览</h1>
                <div class="subtitle">高密度图谱探索视图 · 支持按书卷加载与抽样预览</div>
            </div>
            
            <div class="section">
                <div class="section-title">加载模式</div>
                <div class="mode-tabs">
                    <button class="mode-tab active" data-mode="books">按书卷</button>
                    <button class="mode-tab" data-mode="sample">随机抽样</button>
                </div>
                
                <div id="sample-controls" class="sample-size hidden">
                    <label>节点数量: <span id="sample-value">500</span></label>
                    <input type="range" id="sample-slider" min="100" max="5000" step="100" value="500">
                </div>
            </div>
            
            <div id="books-section" class="section">
                <div class="section-title">
                    选择书卷
                    <span id="selected-count">0/66</span>
                </div>
                <input id="book-search" type="text" placeholder="搜索书卷（中/英文）">
                <div class="btn-group">
                    <button class="btn btn-secondary" id="select-all">全选</button>
                    <button class="btn btn-secondary" id="select-none">清空</button>
                </div>
                <div class="book-grid" id="book-list" style="margin-top: 12px;">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <button class="btn btn-primary" id="load-btn">
                🚀 加载选中数据
            </button>
            
            <div style="font-size: 11px; color: var(--text-muted); margin-top: auto; line-height: 1.6;">
                💡 建议单次加载 1-4 本书卷，交互更流畅。<br>
                双击节点可以快速聚焦，滚轮缩放，拖拽平移。
            </div>
        </div>
        
        <div id="main">
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <div class="loading-text">正在加载数据...</div>
                <div class="loading-progress" id="progress-text"></div>
            </div>
            
            <div id="network"></div>
            
            <div id="stats" class="hidden">
                <div class="stat-row">
                    <span>节点数:</span>
                    <span class="stat-value" id="stat-nodes">0</span>
                </div>
                <div class="stat-row">
                    <span>边数:</span>
                    <span class="stat-value" id="stat-edges">0</span>
                </div>
                <div class="stat-row">
                    <span>加载时间:</span>
                    <span class="stat-value" id="stat-time">0s</span>
                </div>
            </div>
            
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">📚</div>
                <div>选择书卷后点击"加载选中数据"</div>
            </div>
        </div>
    </div>

        // ==================== 初始化 ====================
        function init() {
            renderBookList();
            setupEventListeners();
        }

        function renderBookList() {
            const container = document.getElementById('book-list');
            container.innerHTML = META_DATA.books.map(book => `
                <div class="book-item" data-book="${book.name}" data-key="${(book.cn + ' ' + book.name).toLowerCase()}">
                    <span class="book-icon">${book.icon}</span>
                    <span class="book-name">${book.cn}</span>
                    <span class="book-count">${book.count}</span>
                </div>
            `).join('');
        }

        function setupEventListeners() {
            // 模式切换
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    loadMode = tab.dataset.mode;
                    
                    document.getElementById('books-section').classList.toggle('hidden', loadMode !== 'books');
                    document.getElementById('sample-controls').classList.toggle('hidden', loadMode !== 'sample');
                });
            });

            // 书卷选择
            document.getElementById('book-list').addEventListener('click', e => {
                const item = e.target.closest('.book-item');
                if (!item) return;
                
                const book = item.dataset.book;
                if (selectedBooks.has(book)) {
                    selectedBooks.delete(book);
                    item.classList.remove('selected');
                } else {
                    selectedBooks.add(book);
                    item.classList.add('selected');
                }
                updateSelectedCount();
            });

            // 全选/清空
            document.getElementById('select-all').addEventListener('click', () => {
                META_DATA.books.forEach(b => selectedBooks.add(b.name));
                document.querySelectorAll('.book-item').forEach(item => item.classList.add('selected'));
                updateSelectedCount();
            });

            document.getElementById('select-none').addEventListener('click', () => {
                selectedBooks.clear();
                document.querySelectorAll('.book-item').forEach(item => item.classList.remove('selected'));
                updateSelectedCount();
            });

            // 抽样滑块
            const slider = document.getElementById('sample-slider');
            slider.addEventListener('input', () => {
                document.getElementById('sample-value').textContent = slider.value;
            });

            // 加载按钮
            document.getElementById('load-btn').addEventListener('click', loadData);

            // 书卷搜索
            const searchInput = document.getElementById('book-search');
            searchInput.addEventListener('input', () => {
                const q = searchInput.value.trim().toLowerCase();
                document.querySelectorAll('.book-item').forEach(item => {
                    const key = item.dataset.key || '';
                    item.classList.toggle('hidden', q && !key.includes(q));
                });
            });
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = `${selectedBooks.size}/${META_DATA.books.length}`;
        }

        // ==================== 数据加载 ====================
        async function loadData() {
            const startTime = performance.now();
            showLoading(true);

            try {
                let filteredNodes = [];
                let filteredEdges = [];

                if (loadMode === 'books') {
                    if (selectedBooks.size === 0) {
                        alert('请至少选择一本书');
                        showLoading(false);
                        return;
                    }

                    // 按书卷加载：使用分卷文件（更快）
                    const bookArray = Array.from(selectedBooks);
                    for (let i = 0; i < bookArray.length; i++) {
                        const book = bookArray[i];
                        updateProgress(`正在加载 ${META_DATA.books.find(b => b.name === book)?.cn || book}... (${i+1}/${bookArray.length})`);
                        
                        // 加载该书的节点和边
                        const [nodesRes, edgesRes] = await Promise.all([
                            fetch(`books/${book}_nodes.json`),
                            fetch(`books/${book}_edges.json`)
                        ]);
                        
                        if (nodesRes.ok) {
                            const nodes = await nodesRes.json();
                            filteredNodes.push(...nodes);
                        }
                        if (edgesRes.ok) {
                            const edges = await edgesRes.json();
                            filteredEdges.push(...edges);
                        }
                    }
                } else {
                    // 随机抽样模式：加载全部然后抽样
                    updateProgress('正在加载节点数据...');
                    const nodesResponse = await fetch('scripture_nodes.json');
                    const allNodesData = await nodesResponse.json();
                    
                    const sampleSize = parseInt(document.getElementById('sample-slider').value);
                    filteredNodes = allNodesData.slice(0, sampleSize);
                    
                    const nodeIds = new Set(filteredNodes.map(n => n.id));
                    
                    updateProgress('正在加载边数据...');
                    const edgesResponse = await fetch('scripture_edges.json');
                    const allEdges = await edgesResponse.json();
                    
                    updateProgress('正在过滤关系...');
                    filteredEdges = allEdges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));
                }

                // 渲染图谱
                updateProgress('正在渲染图谱...');
                renderNetwork(filteredNodes, filteredEdges);
                currentNodes = filteredNodes;
                currentEdges = filteredEdges;

                // 更新统计
                const loadTime = ((performance.now() - startTime) / 1000).toFixed(2);
                updateStats(filteredNodes.length, filteredEdges.length, loadTime);

                // 隐藏空状态
                document.getElementById('empty-state').classList.add('hidden');
                document.getElementById('stats').classList.remove('hidden');

            } catch (error) {
                console.error('加载失败:', error);
                alert('加载失败: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // ==================== 渲染图谱 ====================
        function renderNetwork(nodes, edges) {
            // 销毁旧实例
            if (network) {
                network.destroy();
                network = null;
            }

            // 构建 vis.js 数据格式
            const visNodes = nodes.map(n => ({
                id: n.id,
                label: n.name,
                color: {
                    background: n.color,
                    border: n.color,
                    highlight: { background: n.color, border: '#0f172a' }
                },
                shape: 'dot',
                size: 9 + (n.properties?.importance || 0.5) * 12,
                font: { size: 12, color: '#1f2937', face: 'Space Grotesk' },
                title: `<b>${n.name}</b><br/>分类：${n.category || '未分类'}`,
                group: n.category
            }));

            const visEdges = edges.map(e => ({
                from: e.source,
                to: e.target,
                color: { color: 'rgba(71, 85, 105, 0.24)', highlight: '#0ea5e9' },
                width: 1.2,
                smooth: { type: 'dynamic' },
                arrows: { to: { enabled: true, scaleFactor: 0.35 } }
            }));

            // 创建网络
            const container = document.getElementById('network');
            const data = {
                nodes: new vis.DataSet(visNodes),
                edges: new vis.DataSet(visEdges)
            };

            const options = {
                nodes: {
                    borderWidth: 1.5,
                    borderWidthSelected: 2.5,
                    shadow: true
                },
                edges: {
                    shadow: false,
                    smooth: true
                },
                physics: {
                    stabilization: {
                        enabled: true,
                        iterations: 100,
                        updateInterval: 25
                    },
                    barnesHut: {
                        gravitationalConstant: -3500,
                        centralGravity: 0.18,
                        springLength: 105,
                        springConstant: 0.04,
                        damping: 0.1,
                        avoidOverlap: 0.22
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200,
                    hideEdgesOnDrag: nodes.length > 500,
                    hoverConnectedEdges: true,
                    multiselect: true
                },
                layout: {
                    improvedLayout: true
                }
            };

            network = new vis.Network(container, data, options);
            network.once('stabilized', () => {
                network.fit({ animation: { duration: 450, easingFunction: 'easeInOutCubic' } });
            });

            network.on("click", params => {
                if (!params.nodes || params.nodes.length === 0) return;
                const nodeId = params.nodes[0];
                const node = nodes.find(n => n.id === nodeId);
                if (!node) return;
                const neighbors = network.getConnectedNodes(nodeId).length;
                let focusRow = document.getElementById('focus-row');
                if (!focusRow) {
                    document.querySelector('#stats').insertAdjacentHTML(
                        'beforeend',
                        '<div class="stat-row" id="focus-row"><span>当前节点:</span><span class="stat-value">-</span></div>'
                    );
                    focusRow = document.getElementById('focus-row');
                }
                if (focusRow && focusRow.lastElementChild) {
                    focusRow.lastElementChild.textContent = `${node.name} (${neighbors})`;
                }
            });

            network.on("doubleClick", params => {
                if (!params.nodes || params.nodes.length === 0) {
                    network.fit({ animation: { duration: 350 } });
                    return;
                }
                const target = params.nodes[0];
                network.focus(target, { scale: 1.2, animation: { duration: 350 } });
            });
        }

        // ==================== UI 更新 ====================
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        function updateProgress(text) {
            document.getElementById('progress-text').textContent = text;
        }

        function updateStats(nodes, edges, time) {
            document.getElementById('stat-nodes').textContent = nodes.toLocaleString();
            document.getElementById('stat-edges').textContent = edges.toLocaleString();
            document.getElementById('stat-time').textContent = time + 's';
        }

        // ==================== 启动 ====================
        init();
    </script>
</body>
</html>
