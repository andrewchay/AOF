components:
  schemas:
    AgenticReplayReq:
      properties:
        run_id:
          type: string
          minLength: 1
          title: Run Id
      type: object
      required:
      - run_id
      title: AgenticReplayReq
    AgenticRunReq:
      properties:
        run_id:
          type: string
          minLength: 1
          title: Run Id
        session_id:
          type: string
          minLength: 1
          title: Session Id
        query:
          type: string
          minLength: 1
          title: Query
        purpose:
          type: string
          minLength: 1
          title: Purpose
        channel:
          type: string
          minLength: 1
          title: Channel
        release_id:
          type: string
          minLength: 1
          title: Release Id
        release_digest:
          type: string
          minLength: 1
          title: Release Digest
        policy_resource_id:
          type: string
          minLength: 1
          title: Policy Resource Id
        allowed_capabilities:
          items:
            type: string
          type: array
          minItems: 1
          title: Allowed Capabilities
        max_steps:
          type: integer
          maximum: 8.0
          minimum: 1.0
          title: Max Steps
          default: 4
        allow_rag_fallback:
          type: boolean
          title: Allow Rag Fallback
          default: true
        allow_llm_fallback:
          type: boolean
          title: Allow Llm Fallback
          default: false
        query_contract_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Query Contract Id
      type: object
      required:
      - run_id
      - session_id
      - query
      - purpose
      - channel
      - release_id
      - release_digest
      - policy_resource_id
      - allowed_capabilities
      title: AgenticRunReq
    BatchIngestReq:
      properties:
        directory:
