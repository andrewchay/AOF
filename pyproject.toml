[tool.ruff]
# docs/** 下的证据存档脚本为历史复现材料（诊断快照），保持原样不 lint。
# tools/hk4e_pipeline/archive/ 为一次性历史脚本原样归档（压缩风格，路径指向旧工作区）。
# 仅排除目录，不改变 CI 的默认规则集（与修复前的 CI 行为一致）。
extend-exclude = ["docs", "tools/hk4e_pipeline/archive"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = false
# Third-party SDKs without stubs: locally wrapped (plan 12.1 allows typed
# adapters per integration instead of blanket ignores)
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["pika", "pika.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bridge.persistence.postgres_action_run_repository",
           "bridge.persistence.postgres_ledger_repository",
           "bridge.persistence.unit_of_work"]
disable_error_code = ["arg-type", "call-overload", "assignment", "union-attr", "index", "operator", "misc"]
